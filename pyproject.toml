[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-scraper"
version = "1.0.0"
description = "Automated LinkedIn profile scraper with intelligent scheduling and data extraction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Erik Pe", email = "175506674+ErikPe1@users.noreply.github.com"}
]
keywords = ["linkedin", "scraper", "automation", "web-scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "selenium==4.16.0",
    "webdriver-manager==4.0.1",
    "beautifulsoup4==4.12.2",
    "pandas==2.1.4",
    "python-dotenv==1.0.0",
]

[project.urls]
Homepage = "https://github.com/ErikPe1/LNAI"
Repository = "https://github.com/ErikPe1/LNAI.git"
Issues = "https://github.com/ErikPe1/LNAI/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
]

[tool.setuptools]
packages = ["linkedin_scraper"]

[tool.setuptools.package-data]
linkedin_scraper = ["data/.gitkeep"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["linkedin_scraper"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
